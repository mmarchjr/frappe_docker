x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-frappe/buildsuite}:${CUSTOM_TAG:-v16}
  pull_policy: ${PULL_POLICY:-never}
  build:
    context: .
    dockerfile: images/layered/Containerfile
    args:
      FRAPPE_PATH: ${FRAPPE_PATH:-https://github.com/frappe/frappe}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      CACHE_BUST: ${CACHE_BUST:-}
    secrets:
      - apps_json
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  configurator:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: on-failure

  create-site:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        : "$${SITE_NAME:?SITE_NAME not set}";
        : "$${DB_PASSWORD:?DB_PASSWORD not set}";
        : "$${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}";
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=$$(date +%s);
        until [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty") ]] && \
          [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty") ]] && \
          [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty") ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( $$(date +%s)-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "sites/$${SITE_NAME}" ]; then
          bench new-site "$${SITE_NAME}" --mariadb-user-host-login-scope='%' --db-root-username "$${DB_ROOT_USER}" --db-root-password "$${DB_PASSWORD}" --admin-password "$${ADMIN_PASSWORD}" --install-app erpnext --set-default;
        else
          echo "Site $${SITE_NAME} already exists, skipping site creation";
        fi;
        for app in erpnext hrms buildsuite_core employee_self_service; do
          if bench --site "$${SITE_NAME}" list-apps | grep -qx "$${app}"; then
            echo "App $${app} already installed on $${SITE_NAME}, skipping";
          else
            bench --site "$${SITE_NAME}" install-app "$${app}";
          fi;
        done;
        bench --site "$${SITE_NAME}" migrate;
        bench --site "$${SITE_NAME}" clear-cache;
        bench --site "$${SITE_NAME}" clear-website-cache;
        bench --site "$${SITE_NAME}" set-maintenance-mode off;
        bench --site "$${SITE_NAME}" enable-scheduler;
    environment:
      SITE_NAME: ${SITE_NAME:-}
      DB_ROOT_USER: ${DB_ROOT_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    restart: "no"

  migrator:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        if [ "$$MIGRATE_SITES" != "true" ]; then
          echo "[migrator] Migration disabled";
          exit 0;
        fi;
        if [ -z "$$(find sites -mindepth 2 -maxdepth 2 -name site_config.json 2>/dev/null)" ]; then
          echo "[migrator] No sites found, skipping migration";
          exit 0;
        fi;
        echo "[migrator] Migrating all sites";
        bench --site all migrate;
    environment:
      MIGRATE_SITES: ${MIGRATE_SITES:-true}
    restart: on-failure:5

  backend:
    <<: *backend_defaults
    platform: linux/amd64
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  frontend:
    <<: *customizable_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    ports:
      - ${HTTP_PUBLISH_PORT:-8080}:8080

  websocket:
    <<: [*depends_on_configurator, *customizable_image]
    platform: linux/amd64
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    platform: linux/amd64
    command: bench schedule

  db:
    image: mariadb:11.8
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:

secrets:
  apps_json:
    file: ./apps.json
