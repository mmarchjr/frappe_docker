# Provides a run-once service for automated site creation and app installation.

# Compose extension fields of base compose.yaml. See https://github.com/frappe/frappe_docker/blob/main/compose.yaml
# Needed for merging compose files.
x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  pull_policy: ${PULL_POLICY:-always}
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  create-site:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        : "$${SITE_NAME:?SITE_NAME not set}";
        : "$${DB_PASSWORD:?DB_PASSWORD not set}";
        : "$${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}";
        wait-for-it -t 120 $${DB_HOST}:$${DB_PORT};
        wait-for-it -t 120 $${REDIS_CACHE};
        wait-for-it -t 120 $${REDIS_QUEUE};
        export start=$$(date +%s);
        until [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty") ]] && \
          [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty") ]] && \
          [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty") ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( $$(date +%s)-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "sites/$${SITE_NAME}" ]; then
          bench new-site "$${SITE_NAME}" --mariadb-user-host-login-scope='%' --db-root-username "$${DB_ROOT_USER}" --db-root-password "$${DB_PASSWORD}" --admin-password "$${ADMIN_PASSWORD}" --install-app erpnext --set-default;
        else
          echo "Site $${SITE_NAME} already exists, skipping site creation";
        fi;
        for app in erpnext hrms epcforge projectit; do
          if bench --site "$${SITE_NAME}" list-apps | grep -qx "$${app}"; then
            echo "App $${app} already installed on $${SITE_NAME}, skipping";
          else
            bench --site "$${SITE_NAME}" install-app "$${app}";
          fi;
        done;
        bench --site "$${SITE_NAME}" migrate;
        bench --site "$${SITE_NAME}" clear-cache;
        bench --site "$${SITE_NAME}" clear-website-cache;
        bench --site "$${SITE_NAME}" set-maintenance-mode off;
        bench --site "$${SITE_NAME}" enable-scheduler;
    environment:
      SITE_NAME: ${SITE_NAME:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_USER: ${DB_ROOT_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
      REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
    restart: "no"
